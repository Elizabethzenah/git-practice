<!DOCTYPE html>
<head>
    <meta charset="UTF-8">
    <title> forms</title>
    <link crossorigin="anonymous" href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" rel="stylesheet">

    <div class="row">

        <div class="col-sm-2 mx-auto">
            <form action="">
                <div class="mt-3 mb-3"></div>
                <label class="form-label" for="First-name">Firstname</label>
                <input class="form-control" id="First-name" type="text">
            </form>

        </div>

        <div class="col-sm-2 mx-auto border-5">
            <form action="">
                <div class="mt-3 mb-3"></div>
                <label class="form-label" for="Second-name">Secondname</label>
                <input class="form-control" id="second-name" type="text">
            </form>
            <div class="col-sm-4mx-auto">
                <form action="">
                    <div class="mt-3 mb-3"></div>
                    <label class="form-label" for="email">email</label>
                    <input class="form-control" id="email"type="email">
                </form>

            </div>



        </div>


        <div class="col-sm-2 mx-auto">
            <form action="">
                <div class="mt-3 mb-3"></div>
                <label class="form-label" for="password">password</label>
                <input class="form-control" id="password" type="password">
            </form>

        </div>


    </div>

    <div class="mt-3mb-3">

        <div class="col-sm-4mx-auto">

            <label class="form-label" for="edu">education level</label>
            <select class="form-select" id="education" name="edu">
                <option value="">University</option>
                <option value="">college</option>
                <option value="">polytechnic</option>
                <option value="">highschool</option>
                <option value="">other</option>

            </select>

        </div>
        <div class="form-check">
            <input class="form-check-input" id="radio2" name="gender" type="radio" value="option2">female
            <label class="form-check-label" for="radio2"></label>
        </div>
        <div class="form-check">
            <input class="form-check-input" name="gender"type="radio">male
            <label class="form-check-label"></label>
        </div>
        <button class="btn btn-primary mt-3" type="submit">Submit</button>
        </form>






        </body>
